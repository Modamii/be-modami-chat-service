basePath: /v1/chat-services
definitions:
  apperror.Code:
    enum:
    - BAD_REQUEST
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - METHOD_NOT_ALLOWED
    - NOT_ACCEPTABLE
    - REQUEST_TIMEOUT
    - CONFLICT
    - GONE
    - PRECONDITION_FAILED
    - PAYLOAD_TOO_LARGE
    - UNSUPPORTED_MEDIA_TYPE
    - VALIDATION_ERROR
    - UNPROCESSABLE_ENTITY
    - LOCKED
    - FAILED_DEPENDENCY
    - PRECONDITION_REQUIRED
    - TOO_MANY_REQUESTS
    - INTERNAL_ERROR
    - NOT_IMPLEMENTED
    - BAD_GATEWAY
    - SERVICE_UNAVAILABLE
    - TIMEOUT
    - CACHE_MISS
    - CACHE_ERROR
    - MESSAGE_BUS_ERROR
    type: string
    x-enum-varnames:
    - CodeBadRequest
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeMethodNotAllowed
    - CodeNotAcceptable
    - CodeRequestTimeout
    - CodeConflict
    - CodeGone
    - CodePrecondFailed
    - CodePayloadTooLarge
    - CodeUnsupportedMedia
    - CodeValidation
    - CodeUnprocessable
    - CodeLocked
    - CodeFailedDependency
    - CodePrecondRequired
    - CodeTooManyRequest
    - CodeInternal
    - CodeNotImplemented
    - CodeBadGateway
    - CodeServiceUnavail
    - CodeTimeout
    - CodeCacheMiss
    - CodeCacheError
    - CodeMessageBus
  be-modami-chat-service_internal_domain.Conversation:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      last_message:
        $ref: '#/definitions/be-modami-chat-service_internal_domain.LastMessage'
      name:
        type: string
      participants:
        items:
          $ref: '#/definitions/be-modami-chat-service_internal_domain.Participant'
        type: array
      settings:
        $ref: '#/definitions/be-modami-chat-service_internal_domain.ConversationSettings'
      type:
        $ref: '#/definitions/be-modami-chat-service_internal_domain.ConversationType'
      updated_at:
        type: string
    type: object
  be-modami-chat-service_internal_domain.ConversationSettings:
    properties:
      only_admins_can_send:
        type: boolean
    type: object
  be-modami-chat-service_internal_domain.ConversationType:
    enum:
    - direct
    - group
    type: string
    x-enum-varnames:
    - ConversationTypeDirect
    - ConversationTypeGroup
  be-modami-chat-service_internal_domain.ForwardInfo:
    properties:
      original_message_id:
        type: string
      original_sender_id:
        type: string
    type: object
  be-modami-chat-service_internal_domain.LastMessage:
    properties:
      content_preview:
        type: string
      message_id:
        type: string
      sender_id:
        type: string
      sent_at:
        type: string
      type:
        $ref: '#/definitions/be-modami-chat-service_internal_domain.MessageType'
    type: object
  be-modami-chat-service_internal_domain.MediaInfo:
    properties:
      file_name:
        type: string
      file_size:
        type: integer
      height:
        type: integer
      mime_type:
        type: string
      thumbnail_url:
        type: string
      url:
        type: string
      width:
        type: integer
    type: object
  be-modami-chat-service_internal_domain.Message:
    properties:
      content:
        $ref: '#/definitions/be-modami-chat-service_internal_domain.MessageContent'
      conversation_id:
        type: string
      created_at:
        type: string
      deleted:
        type: boolean
      edited:
        type: boolean
      forwarded_from:
        $ref: '#/definitions/be-modami-chat-service_internal_domain.ForwardInfo'
      id:
        type: string
      media:
        $ref: '#/definitions/be-modami-chat-service_internal_domain.MediaInfo'
      reactions:
        items:
          $ref: '#/definitions/be-modami-chat-service_internal_domain.Reaction'
        type: array
      reply_to:
        $ref: '#/definitions/be-modami-chat-service_internal_domain.ReplyInfo'
      sender_id:
        type: string
      type:
        $ref: '#/definitions/be-modami-chat-service_internal_domain.MessageType'
    type: object
  be-modami-chat-service_internal_domain.MessageContent:
    properties:
      mentions:
        items:
          type: string
        type: array
      text:
        type: string
    type: object
  be-modami-chat-service_internal_domain.MessageType:
    enum:
    - text
    - image
    - video
    - file
    - audio
    - location
    - system
    type: string
    x-enum-varnames:
    - MessageTypeText
    - MessageTypeImage
    - MessageTypeVideo
    - MessageTypeFile
    - MessageTypeAudio
    - MessageTypeLocation
    - MessageTypeSystem
  be-modami-chat-service_internal_domain.Participant:
    properties:
      joined_at:
        type: string
      last_read_at:
        type: string
      last_read_message_id:
        type: string
      notifications_muted_until:
        type: string
      role:
        $ref: '#/definitions/be-modami-chat-service_internal_domain.ParticipantRole'
      user_id:
        type: string
    type: object
  be-modami-chat-service_internal_domain.ParticipantRole:
    enum:
    - member
    - admin
    type: string
    x-enum-varnames:
    - RoleMember
    - RoleAdmin
  be-modami-chat-service_internal_domain.Reaction:
    properties:
      emoji:
        type: string
      user_ids:
        items:
          type: string
        type: array
    type: object
  be-modami-chat-service_internal_domain.ReplyInfo:
    properties:
      content_preview:
        type: string
      message_id:
        type: string
      sender_id:
        type: string
    type: object
  internal_adapter_handler.addParticipantRequest:
    properties:
      user_id:
        example: user_xyz
        type: string
    type: object
  internal_adapter_handler.addReactionRequest:
    properties:
      emoji:
        example: "\U0001F44D"
        type: string
    type: object
  internal_adapter_handler.createDirectChatRequest:
    properties:
      user_id:
        example: user_xyz
        type: string
    type: object
  internal_adapter_handler.createGroupRequest:
    properties:
      member_ids:
        example:
        - user_abc
        - user_xyz
        items:
          type: string
        type: array
      name:
        example: Team Alpha
        type: string
    type: object
  internal_adapter_handler.cursorPagedData:
    properties:
      has_more:
        type: boolean
      items: {}
      next_cursor:
        type: string
    type: object
  internal_adapter_handler.editMessageRequest:
    properties:
      text:
        example: Updated message text
        type: string
    type: object
  internal_adapter_handler.markAsReadRequest:
    properties:
      message_id:
        example: 66a1b2c3d4e5f6a7b8c9d0e1
        type: string
    type: object
  internal_adapter_handler.mediaInfoRequest:
    properties:
      file_name:
        example: photo.jpg
        type: string
      file_size:
        example: 204800
        type: integer
      height:
        example: 720
        type: integer
      mime_type:
        example: image/jpeg
        type: string
      thumbnail_url:
        example: https://cdn.example.com/photo_thumb.jpg
        type: string
      url:
        example: https://cdn.example.com/photo.jpg
        type: string
      width:
        example: 1280
        type: integer
    type: object
  internal_adapter_handler.replyToRequest:
    properties:
      content_preview:
        example: How are you?
        type: string
      message_id:
        example: 66a1b2c3d4e5f6a7b8c9d0e1
        type: string
      sender_id:
        example: user_abc
        type: string
    type: object
  internal_adapter_handler.sendMessageRequest:
    properties:
      media:
        allOf:
        - $ref: '#/definitions/internal_adapter_handler.mediaInfoRequest'
        description: Media attachment. Required when type != text.
      mentions:
        description: Optional list of mentioned user IDs.
        example:
        - user_abc
        - user_xyz
        items:
          type: string
        type: array
      reply_to:
        allOf:
        - $ref: '#/definitions/internal_adapter_handler.replyToRequest'
        description: Optional reply reference.
      text:
        description: Plain text body. Required when type=text.
        example: Hello!
        type: string
      type:
        description: 'Message type: text, image, video, file, or audio.'
        example: text
        type: string
    type: object
  internal_adapter_handler.typingRequest:
    properties:
      typing:
        example: true
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        $ref: '#/definitions/apperror.Code'
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/response.FieldError'
        type: array
      message:
        type: string
    type: object
  response.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  response.Meta:
    properties:
      pagination:
        $ref: '#/definitions/response.Pagination'
      request_id:
        type: string
      timestamp:
        type: integer
    type: object
  response.Pagination:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      page:
        type: integer
      per_page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  response.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
host: localhost:8090
info:
  contact:
    email: dev@modami.com
    name: Modami Engineering
  description: Real-time chat API with conversations, messages, reactions, and presence.
  license:
    name: Private
  title: Modami Chat Service
  version: 1.0.0
paths:
  /conversations:
    get:
      description: Returns the caller's conversations ordered by most-recently updated.
      parameters:
      - description: Pagination cursor from previous response
        in: query
        name: cursor
        type: string
      - description: Page size (default 50, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapter_handler.cursorPagedData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List conversations
      tags:
      - Conversations
  /conversations/{conversationID}:
    get:
      description: Returns a single conversation. The caller must be a member.
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/be-modami-chat-service_internal_domain.Conversation'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Not a member
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get a conversation
      tags:
      - Conversations
  /conversations/{conversationID}/messages:
    get:
      description: Returns messages ordered newest-first. Use the returned cursor
        for pagination. The caller must be a member.
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Page size (default 50, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapter_handler.cursorPagedData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Not a member
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List messages in a conversation
      tags:
      - Messages
    post:
      consumes:
      - application/json
      description: Sends a message to a conversation. The caller must be a member.
        Subject to per-user rate limiting.
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      - description: Message payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler.sendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/be-modami-chat-service_internal_domain.Message'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Not a member or admin-only conversation
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Duplicate message
          schema:
            $ref: '#/definitions/response.Response'
        "429":
          description: Rate limited
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Send a message
      tags:
      - Messages
  /conversations/{conversationID}/participants:
    post:
      consumes:
      - application/json
      description: Adds a user to a group conversation. Requires admin role. Max group
        size is 50.
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      - description: User to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler.addParticipantRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Already a member or group is full
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Add a participant to a group
      tags:
      - Participants
  /conversations/{conversationID}/participants/{userID}:
    delete:
      description: Removes a user from a group. An admin can remove any member; a
        member can remove themselves (leave).
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      - description: User ID to remove
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Remove a participant from a group
      tags:
      - Participants
  /conversations/{conversationID}/read:
    post:
      consumes:
      - application/json
      description: Updates the caller's read cursor to the given message. Clears the
        unread count for this conversation.
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      - description: Last read message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler.markAsReadRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Mark messages as read
      tags:
      - Messages
  /conversations/{conversationID}/typing:
    post:
      consumes:
      - application/json
      description: Broadcasts a typing event to other conversation members via Centrifugo.
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: string
      - description: Typing state
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler.typingRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Send typing indicator
      tags:
      - Presence
  /conversations/direct:
    post:
      consumes:
      - application/json
      description: 'Opens a 1-to-1 conversation with another user. Idempotent: returns
        the existing conversation if one already exists.'
      parameters:
      - description: Target user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler.createDirectChatRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/be-modami-chat-service_internal_domain.Conversation'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create or get a direct chat
      tags:
      - Conversations
  /conversations/group:
    post:
      consumes:
      - application/json
      description: Creates a new group chat. The caller is added as admin. Requires
        at least 1 additional member (max 49).
      parameters:
      - description: Group details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler.createGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/be-modami-chat-service_internal_domain.Conversation'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Group is full
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create a group conversation
      tags:
      - Conversations
  /messages/{messageID}:
    delete:
      description: Soft-deletes a message (content is cleared; the record remains).
        Only the original sender may delete.
      parameters:
      - description: Message ID
        in: path
        name: messageID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Delete a message
      tags:
      - Messages
    put:
      consumes:
      - application/json
      description: Updates the text of a message. Only the original sender may edit.
        Only text messages can be edited.
      parameters:
      - description: Message ID
        in: path
        name: messageID
        required: true
        type: string
      - description: New text
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler.editMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/be-modami-chat-service_internal_domain.Message'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Not the sender
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "410":
          description: Message has been deleted
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Edit a message
      tags:
      - Messages
  /messages/{messageID}/reactions:
    post:
      consumes:
      - application/json
      description: Reacts to a message with an emoji. A message may have at most 20
        distinct emojis and 50 users per emoji.
      parameters:
      - description: Message ID
        in: path
        name: messageID
        required: true
        type: string
      - description: Emoji
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler.addReactionRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Reaction limit reached
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Add an emoji reaction
      tags:
      - Reactions
  /messages/{messageID}/reactions/{emoji}:
    delete:
      description: Removes the caller's reaction with the given emoji from a message.
      parameters:
      - description: Message ID
        in: path
        name: messageID
        required: true
        type: string
      - description: URL-encoded emoji character
        in: path
        name: emoji
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Remove an emoji reaction
      tags:
      - Reactions
  /unread:
    get:
      description: Returns a map of conversation_id → unread_count for the caller.
        Counts are served from Redis cache.
      produces:
      - application/json
      responses:
        "200":
          description: conversation_id to unread count
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    format: int64
                    type: integer
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get unread message counts
      tags:
      - Messages
securityDefinitions:
  BearerAuth:
    description: 'JWT Bearer token. Format: "Bearer <token>"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
