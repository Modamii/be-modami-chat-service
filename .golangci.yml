run:
  timeout: 5m
  modules-download-mode: readonly
  skip-dirs:
    - pkg/kafka
    - pkg/storage

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gocritic
    - revive

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-dirs:
    - pkg/kafka
    - pkg/storage
  max-issues-per-linter: 50
  max-same-issues: 5
