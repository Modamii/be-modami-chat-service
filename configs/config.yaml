app:
  name: "chat-service"
  environment: "local"

server:
  port: 8080
  host: "0.0.0.0"
  read_timeout: 15
  write_timeout: 15

mongodb:
  uri: "mongodb://localhost:27017"
  database: "chat"
  max_pool: 100

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

kafka:
  brokers:
    - "localhost:9092"
  consumer_group: "chat-message-processor"

centrifugo:
  api_url: "http://localhost:8000/api"
  api_key: "centrifugo-api-key"

jwt:
  secret: "your-secret-key-change-in-production"
  expiration: 15 # minutes

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  max_age: 300

log:
  level: "debug"
  pretty: true
